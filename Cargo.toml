[package]
name = "ai-proxy-rs"
version = "1.0.0"
edition = "2024"
description = "OpenAI-compatible local AI proxy with streaming, compression, audio, image, and realtime support"
license = "UNLICENSED"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "ai-proxy-rs"
path = "rust/src/main.rs"

[[bin]]
name = "ai-proxy-bench"
path = "rust/src/bin/ai_proxy_bench.rs"

[[bin]]
name = "ai-proxy-ab"
path = "rust/src/bin/ai_proxy_ab.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
http-body-util = "0.1"
prometheus = "0.14"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
rust_socketio = { version = "0.6", features = ["async"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socketioxide = { version = "0.18.6", features = ["tracing"] }
subtle = "2.6"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
